---
name: Checks

on:
  pull_request:
    branches: [main, staging, development]

jobs:
  test-lint:
    name: Test and lint
    runs-on: ubuntu-24.04
    environment: development
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKER_HUB_USER}}
          password: ${{secrets.DOCKER_HUB_TOKEN}}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Create local env file from template
        run: cp .env.dev.example .env.dev

      - name: test
        run: docker compose run --rm recipie-app-backend sh -c "python manage.py wait_for_db && python manage.py test"
      - name: lint
        run: docker compose run --rm recipie-app-backend sh -c "flake8"
