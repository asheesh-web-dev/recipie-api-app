---
name: Checks

on: [push]

jobs:
  test-lint:
    name: Test and lint
    runs-on: ubuntu-22.04
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{secrets.DOCKER_HUB_USER}}
          password: ${{secrets.DOCKER_HUB_TOKEN}}

      - name: Checkout
        uses: actions/Checkout@v7

      - name: test
        run: docker compose run --rm recipie-app-backend sh -c "python manage.py test"
      - name: lint
        run: docker compose run --rm recipie-app-backend sh -c "flake8"
