services:
  recipie-app-db:
    image: postgres:18.4-alpine
    volumes:
      - recipie-api-pg-data:/var/lib/postgresql
    env_file:
      - .env.dev
    ports:
      - "5432:5432"

  recipie-app-backend:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
      - /app/.venv
    ports:
      - "8000:8000"
    env_file:
      - .env.dev
    # This keeps the container alive in the background without starting Django
    command: tail -f /dev/null
    depends_on:
      - recipie-app-db

volumes:
  recipie-api-pg-data:
